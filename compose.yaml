# Koultoura (WCM) dev stack. `make setup` once, then `make up`.
# Reuses the shared PHP-FPM image from ../docker/images/php-8.2-fpm.
# PHP 8.2 on purpose: composer.lock pins inertiajs/inertia-laravel 1.3.0 and
# nette/schema 1.3.0, which cap at 8.3 — 8.4 breaks `composer install`.
name: wcm

services:
  wcm-app:
    build:
      context: ../docker/images/php-8.2-fpm
    image: heritage/php-8.2-fpm
    container_name: wcm-app
    working_dir: /var/www/html
    # Laravel loads .env immutably, so these win over the bind-mounted .env.
    environment:
      DB_HOST: wcm-mysql
      DB_PORT: 3306
    volumes:
      - .:/var/www/html
    depends_on:
      wcm-mysql:
        condition: service_healthy

  wcm-web:
    image: nginx:1.27-alpine
    container_name: wcm-web
    ports:
      - "${WCM_HTTP_PORT:-8123}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wcm-app

  wcm-mysql:
    image: mysql:8.4
    container_name: wcm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "${WCM_DB_PORT:-33061}:3306"
    volumes:
      - wcm-mysqldata:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  wcm-mysqldata:
